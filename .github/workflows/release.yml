# Baut MultiTwitch automatisch für Mac und Windows, sobald ein Versions-Tag (z. B. v1.0.1) hochgeladen wird,
# und hängt die fertigen Dateien an ein GitHub-Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # auch per Knopf in GitHub startbar

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MultiTwitch-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
