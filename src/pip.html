<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Bild-im-Bild</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 600 12px -apple-system, "Segoe UI", sans-serif; color: #fff; }
    webview { position: absolute; inset: 0; }
    /* Leiste oben zum Verschieben – erscheint beim Drüberfahren */
    .bar {
      position: absolute; inset: 0 0 auto 0; height: 30px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
      -webkit-app-region: drag; opacity: 0; transition: opacity .2s; z-index: 2;
    }
    body:hover .bar { opacity: 1; }
    button {
      -webkit-app-region: no-drag; width: 22px; height: 22px; border: none; border-radius: 6px;
      background: rgba(255,255,255,.12); color: #fff; cursor: pointer; display: grid; place-items: center;
    }
    button:hover { background: #ff5c6c; }
    svg { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <div class="bar">
    <span id="name"></span>
    <button id="close" title="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <script>
    const channel = new URLSearchParams(location.search).get('channel') || '';
    if (/^[a-z0-9_]{2,25}$/.test(channel)) {
      document.getElementById('name').textContent = channel;
      const wv = document.createElement('webview');
      wv.setAttribute('partition', 'persist:twitch');
      wv.setAttribute('src', `https://player.twitch.tv/?channel=${channel}&parent=twitch.tv&autoplay=true&muted=false`);
      document.body.prepend(wv);
    }
    document.getElementById('close').onclick = () => window.close();
  </script>
</body>
</html>
